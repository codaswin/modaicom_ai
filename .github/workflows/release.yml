name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # `npm run check` already ran `vite build`, so dist/ exists. This script
      # re-verifies dist/manifest.json and fails if it is missing.
      - name: Package the extension
        run: node scripts/package.mjs

      - name: Attach the ZIP to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="release/modaicom-v${GITHUB_REF_NAME#v}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" \
              --title "modaicom $GITHUB_REF_NAME" --generate-notes
          fi
